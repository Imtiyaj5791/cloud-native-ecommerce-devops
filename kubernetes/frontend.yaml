apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudmart-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudmart-frontend
  template:
    metadata:
      labels:
        app: cloudmart-frontend
    spec:
      containers:
      - name: cloudmart-frontend
        image: 008826676494.dkr.ecr.ap-south-1.amazonaws.com/cloudmart:frontend-v1
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: cloudmart-frontend
spec:
  type: NodePort
  selector:
    app: cloudmart-frontend
  ports:
  - port: 80
    targetPort: 80

