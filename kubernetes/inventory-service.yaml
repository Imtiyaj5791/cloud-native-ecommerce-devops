apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: inventory-service
          image: 008826676494.dkr.ecr.ap-south-1.amazonaws.com/cloudmart:inventory-v1
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 5000
      targetPort: 5000
