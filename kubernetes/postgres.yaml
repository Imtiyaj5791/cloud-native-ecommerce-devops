apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudmart-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudmart-postgres
  template:
    metadata:
      labels:
        app: cloudmart-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: cloudmart
        - name: POSTGRES_USER
          value: cloudmart
        - name: POSTGRES_PASSWORD
          value: cloudmart123
        ports:
        - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: cloudmart-postgres
spec:
  selector:
    app: cloudmart-postgres
  ports:
  - port: 5432
    targetPort: 5432
