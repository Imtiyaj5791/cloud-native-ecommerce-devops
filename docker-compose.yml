services:

  postgres:
    image: postgres:16
    container_name: cloudmart-postgres
    environment:
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cloudmartdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudmart-network


  order-service:
    build:
      context: ./services/order-service
    image: order-service:v1
    container_name: order-service
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - cloudmart-network


  inventory-service:
    build:
      context: ./services/inventory-service
    image: inventory-service:v1
    container_name: inventory-service
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    networks:
      - cloudmart-network


  payment-service:
    build:
      context: ./services/payment-service
    image: payment-service:v1
    container_name: payment-service
    ports:
      - "5002:5002"
    depends_on:
      - postgres
    networks:
      - cloudmart-network


  frontend:
    build:
      context: ./frontend
    image: cloudmart-frontend:v1
    container_name: cloudmart-frontend
    ports:
      - "80:80"
    depends_on:
      - inventory-service
    networks:
      - cloudmart-network


volumes:

  postgres-data:


networks:

  cloudmart-network:
    driver: bridge
